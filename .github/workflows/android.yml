# Build the Android APK on a cloud x86_64 runner.
#
# The NDK ships no host toolchain for linux-aarch64, and this project is
# developed on an aarch64 Jetson, so an APK cannot be produced locally.  This
# workflow is therefore the canonical build: it installs the Android
# SDK/NDK through buildozer, builds ``bin/*.apk`` and uploads it as an artifact.
#
# Manual run: Actions -> Android APK -> Run workflow.
# Download:    the run page -> Artifacts -> rout3-android-apk.
#
# Every branch push builds too, so the artifact exists before a PR is opened
# (the development host is aarch64 and cannot build it locally).  A pull request
# from this repository therefore needs no second run; fork PRs can be built with
# "Run workflow" (workflow_dispatch).
name: Android APK

on:
  push:
    paths:
      - "client/**"
      - "engine/**"
      - "shared/**"
      - "main.py"
      - "buildozer.spec"
      - "tools/android/**"
      - ".github/workflows/android.yml"
      # The reporter only runs inside this workflow, so a change to it must
      # rebuild: otherwise the next failure is diagnosed by the old script.
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# The commit step below publishes the built APK into ``releases/``; that push
# needs write access to the repository.
permissions:
  contents: write

jobs:
  apk:
    # Pin the image instead of following ``ubuntu-latest``: the label moved to
    # Ubuntu 26, whose default JDK is 25.  p4a's Gradle 8.14 wrapper does not
    # support a JDK that new, so the build died in gradlew after ~9 s with no
    # useful verdict in the log.  24.04 is the image the toolchain was
    # verified on; setup-java below still pins the JDK explicitly, so a future
    # image bump cannot silently change it again.
    runs-on: ubuntu-24.04
    # A cold cache compiles CPython, OpenSSL, SDL2 and numpy from source on a
    # 2-core runner; the first run is the slow one.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gradle 8.14 (p4a's wrapper) and AGP 8.11 require a JDK they support.
      # The runner image's default JAVA_HOME is not part of this contract, so
      # it is set here rather than inherited: on Ubuntu 26 it points at JDK 25,
      # and gradlew fails before it can print a Gradle error block.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Buildozer needs the host build tools.  The SDK platform/build-tools and
      # the NDK are downloaded by buildozer itself.  `libncurses-dev` rather
      # than `libncurses5-dev`: the -5 package does not exist on ubuntu-24.04
      # and a missing package fails the whole apt step.
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5" cython

      # The p4a checkout, the SDK/NDK and the per-architecture build trees all
      # live under ~/.buildozer.  Gradle caches separately in ~/.gradle.
      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'tools/android/recipes/**') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ``tee`` keeps the output available when the step fails.  A failed
      # buildozer run is almost always a p4a recipe problem, and the raw job log
      # needs a repository token to read; the next step turns the interesting
      # lines into public check annotations instead (see the script).
      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log
        env:
          # Keep Gradle from asking for a daemon it cannot keep alive.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Publish build failure
        if: failure()
        run: python .github/scripts/report_build_log.py buildozer.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rout3-buildozer-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 7

      - name: List artifacts
        if: success()
        run: ls -lh bin/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rout3-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # Artifacts expire after 30 days, and the APK is a release like the
      # desktop ``.pyz`` files already kept in ``releases/``.  Only one APK per
      # version is committed: a rebuild of the same version produces the same
      # file name and is skipped, so the history does not grow by ~26 MB on
      # every CI run.  A new ``version`` in buildozer.spec commits a new file.
      - name: Commit APK to releases
        run: |
          set -euo pipefail
          apk=$(ls -1 bin/*.apk | head -n 1)
          name=$(basename "$apk")
          target="releases/$name"
          if [ -f "$target" ]; then
            echo "$target is already tracked; keeping it"
            exit 0
          fi
          cp "$apk" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "APK: $name"
          git push origin "HEAD:${GITHUB_REF_NAME}"
