name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Headless runner: no real display/audio devices.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame numpy
      - name: Engine import boundary
        run: python tools/check_engine_imports.py
      - name: Byte-compile
        run: python -m compileall -q shared server client engine
      - name: Smoke tests
        run: python tools/run_smoke.py
