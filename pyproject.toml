[project]
name = "rout-iii"
version = "1.1.0"
description = "Server-authoritative Doom-style FPS with a DDA raycasting renderer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.5.0",
]

[project.optional-dependencies]
# The client uses numpy for perspective flats (surfarray); it is optional and
# auto-installed on first client launch. The server is stdlib-only.
client = [
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The game runs from the repo root; this metadata is for tooling/IDE only.
packages = ["server", "client", "engine", "shared"]
