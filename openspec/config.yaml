schema: spec-driven

# Project context
# Показывается AI при создании артефактов.
context: |
  ROUT III — серверо-ориентированный FPS-шутер в стиле Doom 1 (DDA raycasting).
  Tech stack: Python 3.12 (`py -3.12`), pygame 2.6 (SDL 2.28), asyncio, UDP (big-endian struct protocol).
  Архитектура: авторитетный сервер (server/), pygame клиент (client/), общий протокол (shared/).
  Лобби: один сервер, много партий; клиент: меню → партия → игра (lobby ⇄ game).
  Запуск: run_server.bat / run_client.bat. Актуальная спека: openspec/specs/001-doom-shooter.md
  Детали протокола: SPEC.md (в корне проекта).

